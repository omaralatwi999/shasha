          (function(root){
          'use strict';
          const C=typeof module!=='undefined'?require('./core.js'):root.Core;
          function calculate(day,ramadan){
            const R=Math.PI/180,n=Date.parse(day+'T09:00:00Z')/864e5+2440587.5-2451545;
            const g=(357.529+.98560028*n)%360,q=(280.459+.98564736*n)%360;
            const L=(q+1.915*Math.sin(g*R)+.020*Math.sin(2*g*R))%360,e=23.439-.00000036*n;
            let ra=Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15;
            ra=((ra%24)+24)%24;let eq=q/15-ra;if(eq>12)eq-=24;if(eq< -12)eq+=24;
            const dec=Math.asin(Math.sin(e*R)*Math.sin(L*R)),lat=31.33*R,noon=15-37.34/15-eq;
            function angle(a){let c=(-Math.sin(a*R)-Math.sin(dec)*Math.sin(lat))/(Math.cos(dec)*Math.cos(lat));return Math.acos(Math.max(-1,Math.min(1,c)))/R/15;}
            const asr=-Math.atan(1/(1+Math.tan(Math.abs(lat-dec))))/R,mag=noon+angle(.833);
            return {Fajr:C.hm(noon-angle(18.5)),Dhuhr:C.hm(noon),Asr:C.hm(noon+angle(asr)),Maghrib:C.hm(mag),Isha:C.hm(mag+(ramadan?2:1.5))};
          }
          if(typeof module!=='undefined')module.exports=calculate;else root.calculatePrayer=calculate;
          })(typeof window==='undefined'?globalThis:window);
