name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/om/shasha app/src/main/assets app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.om.shasha'
            compileSdk 34
            defaultConfig { applicationId 'com.om.shasha'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#2B3A67"/></shape>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <queries>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
            </queries>
            <application android:label="شاشة" android:icon="@drawable/banner" android:banner="@drawable/banner">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.HOME"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/om/shasha/MainActivity.java <<'EOF'
          package com.om.shasha;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.media.tv.TvContract;
          import android.media.tv.TvInputInfo;
          import android.media.tv.TvInputManager;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import java.io.ByteArrayOutputStream;
          public class MainActivity extends Activity {
            ResolveInfo find(String q) {
              PackageManager pm = getPackageManager();
              String[] keys = q.toLowerCase().split("\\|");
              String[] cats = {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER};
              for (String c : cats) {
                Intent m = new Intent(Intent.ACTION_MAIN);
                m.addCategory(c);
                for (ResolveInfo r : pm.queryIntentActivities(m, 0)) {
                  if (r.activityInfo.packageName.equals(getPackageName())) continue;
                  String label = r.loadLabel(pm).toString().toLowerCase();
                  for (String k : keys) {
                    if (k.length() > 0 && label.contains(k)) return r;
                  }
                }
              }
              return null;
            }
            class Bridge {
              @JavascriptInterface
              public String icon(String q) {
                try {
                  PackageManager pm = getPackageManager();
                  Drawable d = null;
                  if (q.startsWith("pkg:")) d = pm.getApplicationIcon(q.substring(4));
                  else if (q.startsWith("name:")) {
                    ResolveInfo r = find(q.substring(5));
                    if (r != null) d = r.loadIcon(pm);
                  }
                  if (d == null) return "";
                  Bitmap bm = Bitmap.createBitmap(192, 192, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bm);
                  d.setBounds(0, 0, 192, 192);
                  d.draw(c);
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  bm.compress(Bitmap.CompressFormat.PNG, 100, o);
                  return "data:image/png;base64," + Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP);
                } catch (Exception e) { return ""; }
              }
              @JavascriptInterface
              public String inputs() {
                StringBuilder sb = new StringBuilder();
                try {
                  TvInputManager tm = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                  for (TvInputInfo t : tm.getTvInputList()) {
                    if (t.getType() == TvInputInfo.TYPE_HDMI) {
                      sb.append(t.getId()).append("\t").append(t.loadLabel(MainActivity.this)).append("\n");
                    }
                  }
                } catch (Exception e) { }
                return sb.toString();
              }
              @JavascriptInterface
              public void launch(final String q) {
                runOnUiThread(new Runnable() { public void run() {
                  try {
                    Intent i = null;
                    PackageManager pm = getPackageManager();
                    if (q.equals("settings")) i = new Intent(Settings.ACTION_SETTINGS);
                    else if (q.startsWith("input:")) i = new Intent(Intent.ACTION_VIEW, TvContract.buildChannelUriForPassthroughInput(q.substring(6)));
                    else if (q.startsWith("pkg:")) {
                      String p = q.substring(4);
                      i = pm.getLeanbackLaunchIntentForPackage(p);
                      if (i == null) i = pm.getLaunchIntentForPackage(p);
                    } else if (q.startsWith("name:")) {
                      ResolveInfo r = find(q.substring(5));
                      if (r != null) {
                        i = new Intent(Intent.ACTION_MAIN);
                        i.setClassName(r.activityInfo.packageName, r.activityInfo.name);
                      }
                    }
                    if (i != null) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                    } else Toast.makeText(MainActivity.this, "غير موجود", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                    Toast.makeText(MainActivity.this, "تعذر الفتح", Toast.LENGTH_SHORT).show();
                  }
                }});
              }
            }
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              w.setBackgroundColor(0xFF111111);
              w.addJavascriptInterface(new Bridge(), "Android");
              setContentView(w);
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed() { }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          *{box-sizing:border-box;margin:0}
          html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Noto Naskh Arabic','Noto Sans Arabic',sans-serif}
          #bg,.shade{position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1}
          .shade{background:radial-gradient(circle at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.65) 100%);z-index:0}
          .scene{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity 5s ease-in-out;filter:brightness(0.95)}
          .scene.on{opacity:1}
          .page{position:fixed;left:0;top:0;width:100%;height:100%;padding:2.5vw 4vw 3vw;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
          .top,.mid,.bot{display:flex;justify-content:space-between}
          .top{align-items:flex-start}
          .mid{align-items:center}
          .bot{align-items:flex-end}
          .sm{font-size:1.6vw;opacity:.9}
          .big{font-size:3vw;font-weight:700}
          #hj{font-size:2.6vw;font-weight:700}
          #temp{font-size:4.5vw;font-weight:700;line-height:1.1}
          .wx{text-align:left}
          #time{font-size:13vw;font-weight:700;line-height:1;text-shadow:0 0 40px rgba(0,0,0,0.5)}
          #ampm{font-size:3.5vw}
          .clock{text-align:center}
          .card{width:36vw;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:2vw;padding:2vw;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:0 1.5vw 3.5vw rgba(0,0,0,0.3)}
          #ayah{font-size:2.5vw;line-height:1.9;margin:1vw 0}
          .pr{display:flex;gap:1.2vw}
          .pt{text-align:center;padding:.5vw 1vw;border-radius:1vw;font-size:1.7vw;background:rgba(0,0,0,0.2);backdrop-filter:blur(10px)}
          .pt.on{background:rgba(255,255,255,0.35);box-shadow:0 0 15px rgba(255,255,255,0.4)}
          .apps{display:flex;gap:1.8vw;justify-content:center;align-items:center}
          .t{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:.8vw;color:#fff;font-family:inherit;transition:transform .25s cubic-bezier(0.2, 0.8, 0.2, 1);cursor:pointer}
          .ic{width:7.2vw;height:7.2vw;border-radius:1.8vw;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 1vw 2.5vw rgba(0,0,0,0.35),inset 0 1px 1px rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
          .ic img{width:72%;height:72%;object-fit:contain;border-radius:20%}
          .ic svg{width:55%;height:55%}
          .ic span{font-size:3.2vw;font-weight:700}
          .lb{font-size:1.4vw;text-shadow:0 1px 6px rgba(0,0,0,0.7);transition:font-weight .2s}
          .t:focus{outline:none;transform:scale(1.18);z-index:5}
          .t:focus .ic{border-color:#fff;background:rgba(255,255,255,0.32);box-shadow:0 0 0 .35vw rgba(255,255,255,0.85),0 1.5vw 3.5vw rgba(0,0,0,0.6)}
          .t:focus .lb{font-weight:700;text-shadow:0 0 12px rgba(255,255,255,0.9)}
          #adhan{display:none;position:fixed;left:0;top:0;width:100%;height:100%;align-items:center;justify-content:center;pointer-events:none;z-index:10}
          #adhan .big{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(20px);border-radius:2vw;padding:2.5vw 5vw;font-size:4vw}
          </style></head><body>
          <div id="bg"></div><div class="shade"></div>
          <div class="page">
          <div class="top">
          <div><div id="hj"></div><div class="sm" id="gr"></div></div>
          <div class="wx"><div id="temp">--°</div><div class="sm" id="cond"></div><div class="sm" id="hl"></div><div class="sm" id="city"></div></div>
          </div>
          <div class="mid">
          <div class="clock"><div id="time">--:--</div><div id="ampm"></div></div>
          <div class="card"><div class="sm">آية اليوم</div><div id="ayah"></div><div class="sm" id="sura"></div></div>
          </div>
          <div class="bot"><div id="nx"></div><div id="ram"></div><div class="pr" id="list"></div></div>
          <div class="apps" id="apps"></div>
          </div>
          <div id="adhan"></div>
          <script>
          var $=function(i){return document.getElementById(i)};
          var LAT=31.33,LON=37.34,CITY='القريات';
          function L(p){if(window.Android)Android.launch(p)}
          var AR='٠١٢٣٤٥٦٧٨٩';function ar(x){return String(x).replace(/\d/g,function(d){return AR[d]})}
          var P=[['Fajr','الفجر'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']],T=null,H=null,cur='';
          var DY=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
          var MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
          var AY=[["وَقُل رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ","سورة المؤمنون ٩٧"],["أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ","سورة الرعد ٢٨"],["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","سورة الشرح ٥"],["وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ","سورة الطلاق ٣"],["رَبِّ اشْرَحْ لِي صَدْرِي","سورة طه ٢٥"],["إِنَّ اللَّهَ مَعَ الصَّابِرِينَ","سورة البقرة ١٥٣"],["وَقُل رَّبِّ زِدْنِي عِلْمًا","سورة طه ١١٤"]];
          var a=AY[Math.floor(Date.now()/864e5)%AY.length];$('ayah').textContent='﴿'+a[0]+'﴾';$('sura').textContent=a[1];$('city').textContent=CITY;
          function at(s,add){var d=new Date(),p=s.split(':');d.setHours(+p[0],+p[1],0,0);d.setDate(d.getDate()+add);return d}
          function f12(s){var p=s.slice(0,5).split(':'),h=+p[0];return ar((h%12||12)+':'+p[1])+(h<12?' ص':' م')}
          function z(x){return(x<10?'0':'')+x}
          function tick(){var d=new Date(),h=d.getHours(),m=d.getMinutes();
          $('time').textContent=ar((h%12||12)+':'+z(m));$('ampm').textContent=h<12?'ص':'م';
          $('gr').textContent=ar(d.getDate())+' '+MN[d.getMonth()]+' '+ar(d.getFullYear());
          $('hj').textContent=DY[d.getDay()]+(H?'، '+ar(H.day)+' '+H.month.ar+' '+ar(H.year)+' هـ':'');
          var r=Math.ceil((new Date(2027,1,8)-d)/864e5);
          $('ram').innerHTML=r>0?'<div class="sm">رمضان ١٤٤٨</div><div class="big">'+ar(r)+' يوم</div>':'';
          if(!T)return;var nx=null,ad=null;
          for(var k=0;k<5;k++){var tt=at(T[P[k][0]],0);if(d>=tt&&d-tt<12e4)ad=P[k][1]}
          $('adhan').style.display=ad?'flex':'none';
          if(ad)$('adhan').innerHTML='<div class="big">حان الآن موعد أذان '+ad+'</div>';
          for(var i=0;i<5;i++){var t=at(T[P[i][0]],0);if(t>d){nx=[P[i][1],t];break}}
          if(!nx)nx=[P[0][1],at(T.Fajr,1)];
          var s=Math.floor((nx[1]-d)/1000);
          $('nx').innerHTML='<div class="sm">الصلاة القادمة</div><div class="big">'+nx[0]+'</div><div class="sm">بعد '+ar(z(Math.floor(s/3600))+':'+z(Math.floor(s%3600/60))+':'+z(s%60))+'</div>';
          if(cur!=nx[0]){cur=nx[0];draw()}}
          function draw(){var h='';for(var i=0;i<5;i++){h+='<div class="pt'+(P[i][1]==cur?' on':'')+'"><div class="sm">'+P[i][1]+'</div><div>'+f12(T[P[i][0]])+'</div></div>'}$('list').innerHTML=h}
          function prayer(){fetch('https://api.aladhan.com/v1/timings?latitude='+LAT+'&longitude='+LON+'&method=4').then(function(r){return r.json()}).then(function(j){T=j.data.timings;H=j.data.date.hijri;cur='';tick()}).catch(function(){})}
          function wc(c){if(c==0)return'صحو';if(c<3)return'غائم جزئياً';if(c==3)return'غائم';if(c==45||c==48)return'ضباب';if(c<60)return'رذاذ';if(c<70)return'مطر';if(c<80)return'ثلج';if(c<90)return'زخات مطر';return'عاصفة رعدية'}
          function weather(){fetch('https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto').then(function(r){return r.json()}).then(function(j){$('temp').textContent=ar(Math.round(j.current.temperature_2m))+'°';$('cond').textContent=wc(j.current.weather_code);$('hl').textContent='↑'+ar(Math.round(j.daily.temperature_2m_max[0]))+'° ↓'+ar(Math.round(j.daily.temperature_2m_min[0]))+'°'}).catch(function(){})}
          
          /* خلفيات تفاعلية سينمائية تحاكي Apple TV بدقة */
          var SC=[
          {s:['#0a192f','#172a45','#203a43'],st:1,l:[['#132238','M0 580 Q300 480 650 560 T1300 520 T1600 580 V900H0Z'],['#0d1b2a','M0 700 Q400 620 900 680 T1600 650 V900H0Z']]},
          {s:['#2c1630','#4a2040','#1f1c2c'],st:1,l:[['#3d1f38','M0 550 Q350 450 750 530 T1500 500 T1600 550 V900H0Z'],['#251322','M0 680 Q450 590 1000 660 T1600 630 V900H0Z']]},
          {s:['#051937','#004d7a','#008793'],l:[['#04325c','M0 600 Q300 500 700 580 T1400 540 T1600 600 V900H0Z'],['#02223f','M0 720 Q450 630 950 700 T1600 680 V900H0Z']]},
          {s:['#141E30','#243B55','#0f2027'],st:1,l:[['#1c2d42','M0 570 Q350 470 800 550 T1500 520 T1600 570 V900H0Z'],['#0d1724','M0 690 Q400 600 900 670 T1600 650 V900H0Z']]}];

          function scene(o,i){var g='<defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="'+o.s[0]+'"/><stop offset="50%" stop-color="'+o.s[1]+'"/><stop offset="100%" stop-color="'+o.s[2]+'"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g'+i+')"/>';
          if(o.st){for(var k=0;k<80;k++){g+='<circle cx="'+((k*83)%1600)+'" cy="'+((k*47)%500)+'" r="'+(0.8+(k%3)*0.8)+'" fill="#ffffff" opacity="'+(0.2+(k%5)*0.15)+'"/>'}}
          for(var n=0;n<o.l.length;n++){g+='<path d="'+o.l[n][1]+'" fill="'+o.l[n][0]+'" opacity="0.85"/>'}
          return'<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">'+g+'</svg>'}
          
          $('bg').innerHTML=SC.map(scene).join('');
          var els=$('bg').getElementsByClassName('scene'),si=0;els[0].classList.add('on');
          setInterval(function(){els[si].classList.remove('on');si=(si+1)%els.length;els[si].classList.add('on')},12000);

          var GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-dasharray="3.3 3.3"/></svg>';
          var HD='<svg viewBox="0 0 24 24"><path d="M3 7h18v7l-3 3h-3v2H9v-2H6l-3-3z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 10.5h10" stroke="#fff" stroke-width="1.8"/></svg>';
          
          function addTile(label,spec,svg){
          var b=document.createElement('button');b.className='t';b.onclick=function(){L(spec)};
          var u=(svg||!window.Android)?'':Android.icon(spec),h='<div class="ic">';
          if(svg)h+=svg;else if(u)h+='<img src="'+u+'">';else h+='<span>'+label.charAt(0)+'</span>';
          b.innerHTML=h+'</div><div class="lb">'+label+'</div>';$('apps').appendChild(b)}
          
          addTile('ثمانية','name:ثمانية|thmanyah');
          addTile('شاشا','name:شاشا|shasha');
          addTile('Google Play','pkg:com.android.vending');
          addTile('YouTube','pkg:com.google.android.youtube.tv');
          addTile('Netflix','pkg:com.netflix.ninja');
          
          var ins=window.Android?Android.inputs():'';
          if(ins){ins.split('\n').forEach(function(l){if(l){var p=l.split('\t');addTile(p[1]||'HDMI','input:'+p[0],HD)}})}else addTile('HDMI','name:تلفزيون مباشر|live tv',HD);
          addTile('الإعدادات','settings',GEAR);
          
          try{$('apps').firstChild.focus()}catch(e){}
          prayer();weather();tick();setInterval(tick,1000);setInterval(prayer,36e5);setInterval(weather,9e5);
          </script></body></html>
          EOF
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk shasha.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: shasha.apk
          make_latest: true
