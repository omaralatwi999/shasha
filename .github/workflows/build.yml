                      String result=packet(id,data,failure);
                      runOnUiThread(()->{if(web!=null&&!isFinishing())reply.postMessage(result);});
                    });
                  }
                }catch(Exception error){Log.w("Shasha","Invalid message",error);}
              });
              setContentView(web);web.loadUrl(ORIGIN+"/assets/index.html");
            }
            private void js(String code){if(web!=null)web.evaluateJavascript(code,null);}
            @Override protected void onResume(){super.onResume();if(web!=null){web.onResume();web.resumeTimers();js("window.resumeApp&&window.resumeApp()");}}
            @Override protected void onPause(){js("window.pauseApp&&window.pauseApp()");if(web!=null){web.onPause();web.pauseTimers();}super.onPause();}
