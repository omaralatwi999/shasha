            private byte[] icon(String pkg){
              byte[] cached=icons.get(pkg); if(cached!=null)return cached;
              Bitmap bitmap=null;
              try{
                Drawable drawable=getPackageManager().getApplicationIcon(pkg);
                bitmap=Bitmap.createBitmap(96,96,Bitmap.Config.ARGB_8888);
                drawable.setBounds(0,0,96,96);drawable.draw(new Canvas(bitmap));
                ByteArrayOutputStream out=new ByteArrayOutputStream();
                bitmap.compress(Bitmap.CompressFormat.PNG,100,out);
                byte[] bytes=out.toByteArray();icons.put(pkg,bytes);return bytes;
