      - name: JavaScript syntax and compatibility tests
        working-directory: shasha-v2
        run: |
          set -euo pipefail
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/prayer.js
          node --check app/src/main/assets/app.js
          CORE_PATH=../app/src/main/assets/core.js node --test tests/compatibility.test.cjs
          node --test tests/core.test.cjs
      - name: Browser and remote-control regression tests
        working-directory: shasha-v2
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-dev --save-exact @playwright/test@1.51.1
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Restore previous debug signing key when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Android Lint, tests, and APK
        working-directory: shasha-v2
        run: gradle lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Package APK and checksums
        run: |
          set -euo pipefail
          mkdir -p shasha-download
          cp shasha-v2/app/build/outputs/apk/debug/app-debug.apk shasha-download/shasha-v2-debug.apk
          cp shasha-v2/README-V2.md shasha-download/
          cd shasha-download
          sha256sum shasha-v2-debug.apk > SHA256SUMS.txt
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: shasha-v2-debug
          path: shasha-download/
          if-no-files-found: error
          retention-days: 30
      - name: Reports and generated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shasha-v2-source-and-reports
          path: |
            shasha-v2/app/src/
            shasha-v2/app/build.gradle
            shasha-v2/build.gradle
            shasha-v2/settings.gradle
            shasha-v2/gradle.properties
            shasha-v2/tests/
            shasha-v2/playwright.config.cjs
            shasha-v2/package.json
            shasha-v2/package-lock.json
            shasha-v2/README-V2.md
            shasha-v2/playwright-report/
            shasha-v2/test-results/
            shasha-v2/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
