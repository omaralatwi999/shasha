              WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/",new WebViewAssetLoader.AssetsPathHandler(this)).build();
              web.setWebViewClient(new WebViewClientCompat(){
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){return true;}
                @Override public boolean shouldOverrideUrlLoading(WebView view,String url){return true;}
                @Override public WebResourceResponse shouldInterceptRequest(WebView view,WebResourceRequest request){
                  Uri uri=request.getUrl();String host=uri.getHost(),path=uri.getPath();
                  if("https".equals(uri.getScheme())&&"appassets.androidplatform.net".equals(host)){
                    if(path!=null&&path.startsWith("/icons/")){
                      byte[] data=icon(uri.getLastPathSegment());return response("image/png",data==null?new byte[0]:data,data==null?404:200);
                    }
                    WebResourceResponse asset=loader.shouldInterceptRequest(uri);
                    return asset!=null?asset:response("text/plain",new byte[0],404);
                  }
                  if("https".equals(uri.getScheme())&&("api.aladhan.com".equals(host)||"api.open-meteo.com".equals(host)))return null;
                  return response("text/plain",new byte[0],404);
                }
              });
              WebViewCompat.addWebMessageListener(web,"Native",Collections.singleton(ORIGIN),(view,message,origin,mainFrame,reply)->{
                if(!mainFrame||!ORIGIN.equals(origin.toString()))return;
                try{
                  JSONObject request=new JSONObject(message.getData());int id=request.getInt("id");String method=request.getString("method");
                  if("launch".equals(method)){
                    try{launch(request.optString("arg"));reply.postMessage(packet(id,true,null));}
                    catch(Exception error){Log.w("Shasha","Launch failed",error);reply.postMessage(packet(id,null,error));}
                  }else{
