name: Shasha TV - tested build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shasha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Characterize existing calculations before replacement
        run: |
          set -euo pipefail
          mkdir -p shasha-v2/tests
          cd shasha-v2/tests
          cat > legacy.cjs <<'EOF'
          // Extracted from the supplied implementation, unchanged.
          var AR='Ù Ù¡Ù¢Ù£Ù¤Ù¥Ù¦Ù§Ù¨Ù©';
          function ar(x){return String(x).replace(/\d/g,function(d){return AR[d]})}
          function z(x){return(x<10?'0':'')+x}
          function hm(h){h=((h%24)+24)%24;var m=Math.round(h*60);return z(Math.floor(m/60)%24)+':'+z(m%60)}
          function f12(s){var p=String(s).slice(0,5).split(':'),h=+p[0];return ar((h%12||12)+':'+p[1])+(h<12?' Øµ':' Ù…')}
          function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
          module.exports={ar,z,hm,f12,dim};
          EOF
          cat > compatibility.test.cjs <<'EOF'
          const {test}=require('node:test');
          const assert=require('node:assert/strict');
          const C=require(process.env.CORE_PATH||'./legacy.cjs');
          test('Arabic digits and padding remain compatible',()=>{
            assert.equal(C.ar('12:05'),'Ù¡Ù¢:Ù Ù¥'); assert.equal(C.z(4),'04');
          });
          test('12-hour midnight/noon remain compatible',()=>{
            assert.equal(C.f12('00:05'),'Ù¡Ù¢:Ù Ù¥ Øµ');
            assert.equal(C.f12('12:00'),'Ù¡Ù¢:Ù Ù  Ù…');
            assert.equal(C.f12('23:59'),'Ù¡Ù¡:Ù¥Ù© Ù…');
          });
          test('minute rollover and negative hours remain compatible',()=>{
            assert.equal(C.hm(23.999),'00:00'); assert.equal(C.hm(-1),'23:00');
          });
          test('Gregorian leap years remain compatible',()=>{
            assert.equal(C.dim(2024,2),29); assert.equal(C.dim(2100,2),28);
          });
          EOF
          node --test compatibility.test.cjs
      - name: Generate isolated Android project
        run: |
          set -euo pipefail
          cd shasha-v2
          mkdir -p app/src/main/java/com/om/shasha app/src/main/assets/logos app/src/main/res/drawable
          if [ -d ../logos ]; then cp -r ../logos/. app/src/main/assets/logos/; fi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name='ShashaTV'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.om.shasha'
            compileSdk 34
            defaultConfig {
              applicationId 'com.om.shasha'
              minSdk 24
              targetSdk 34
              versionCode __VERSION_CODE__
              versionName '2.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint { abortOnError true }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF
          sed -i "s/__VERSION_CODE__/$((100000 + ${{ github.run_number }}))/" app/build.gradle
          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <size android:width="320dp" android:height="180dp"/>
            <solid android:color="#10243A"/>
            <corners android:radius="16dp"/>
