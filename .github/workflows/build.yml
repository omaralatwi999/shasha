          function addTile(label,spec,iconKey){
          var b=document.createElement('button');b.className='t';b.onclick=function(){L(spec)};
          var h='<div class="ic">';
          var u=(iconKey||!window.Android)?'':Android.icon(spec);
          if(iconKey && ICONS[iconKey]) h+=ICONS[iconKey];
          else if(u) h+='<img src="'+u+'">';
          else h+='<span style="font-size:2.8vw;font-weight:700">'+label.charAt(0)+'</span>';
          b.innerHTML=h+'</div><div class="lb">'+label+'</div>';$('apps').appendChild(b)}

          addTile('ثمانية','name:ثمانية|thmanyah',null);
          addTile('شاشا','name:شاشا|shasha',null);
          addTile('Google Play','pkg:com.android.vending','play');
          addTile('YouTube','pkg:com.google.android.youtube.tv','youtube');
          addTile('Netflix','pkg:com.netflix.ninja','netflix');

          var ins=window.Android?Android.inputs():'';
          if(ins){ins.split('\n').forEach(function(l){if(l){var p=l.split('\t');addTile(p[1]||'HDMI','input:'+p[0],'hdmi')}})}else addTile('HDMI','name:تلفزيون مباشر|live tv','hdmi');
          addTile('الإعدادات','settings','gear');

          try{$('apps').firstChild.focus()}catch(e){}
          prayer();weather();tick();setInterval(tick,1000);setInterval(prayer,36e5);setInterval(weather,9e5);
          </script></body></html>
          EOF
